# Server Configuration
server.port=8080

# Application Name
spring.application.name=mediaflow-backend

# File Upload Limits (supports large multimedia video files)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.enabled=true

# Database Configuration (Default: Embedded Persistent H2)
spring.datasource.url=jdbc:h2:file:./data/mediaflowdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (for administrative database inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Storage Configuration
mediaflow.storage.root=./storage
mediaflow.storage.max-user-quota-mb=1024

# Media Processing (FFmpeg and FFprobe binaries)
mediaflow.ffmpeg.path=ffmpeg
mediaflow.ffprobe.path=ffprobe
mediaflow.ffmpeg.hls-segment-duration=4

# JWT Security
mediaflow.jwt.secret=MediaFlowSuperSecretSecureKeyForJwtTokenGeneration2026AdaptiveStreamingCompressionSystem
mediaflow.jwt.expiration-ms=86400000

# CORS Configuration
mediaflow.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
